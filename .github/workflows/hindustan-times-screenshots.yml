name: Hindustan Times Screenshot Monitoring

on:
  schedule:
    # 08:00 and 14:00 India Standard Time (UTC+05:30)
    - cron: "30 2 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hindustan-times-screenshot-monitor
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required proxy configuration
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
        run: |
          if [ -z "$PROXY_SERVER" ]; then
            echo "::error::Missing PROXY_SERVER repository secret. Configure a verified Delhi/NCR proxy; capture remains disabled."
            exit 1
          fi

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture 25 viewport screenshots with ad diagnostics
        env:
          SCREENSHOT_COUNT: "25"
          NAV_TIMEOUT_MS: "30000"
          JPEG_QUALITY: "70"
          AD_WAIT_MS: "6000"
          REQUIRE_INDIA_PROXY: "true"
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: python scripts/capture_hindustan_times.py

      - name: Verify screenshot batch
        run: |
          python scripts/validate_hindustan_times_batch.py screenshots
          echo "## Hindustan Times screenshot batch" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: https://www.hindustantimes.com/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Screenshots: 25 unique pages, 1440 × 1000 viewport JPEGs" >> "$GITHUB_STEP_SUMMARY"
          echo "- Schedule: 08:00 and 14:00 IST daily" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshot gallery and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hindustan-times-screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30
