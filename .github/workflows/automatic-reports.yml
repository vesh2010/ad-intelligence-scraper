name: Automatic 13-Site Ad Intelligence Reports

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: automatic-13-site-reports
  cancel-in-progress: true

env:
  MAX_PAGES: '5'
  MAX_DEPTH: '5'
  MAX_DISCOVERED_URLS: '1000'
  BOTH_DEVICES: 'true'
  MAX_RUNTIME_MINUTES: '10'
  AD_SCRAPER_RETAIN_SCREENSHOTS: 'false'
  PYTHONPATH: backend

jobs:
  site-reports:
    name: Report — ${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: ndtv
            site_url: https://ndtv.com/
          - key: news18
            site_url: https://news18.com/
          - key: indian-express
            site_url: https://indianexpress.com/
          - key: times-of-india
            site_url: https://timesofindia.indiatimes.com/
          - key: zee-news
            site_url: https://zeenews.india.com/
          - key: economic-times
            site_url: https://economictimes.indiatimes.com/
          - key: moneycontrol
            site_url: https://moneycontrol.com/
          - key: business-standard
            site_url: https://business-standard.com/
          - key: navbharat-times
            site_url: https://navbharattimes.indiatimes.com/
          - key: dainik-jagran
            site_url: https://jagran.com/
          - key: aaj-tak
            site_url: https://aajtak.in/
          - key: news18-hindi
            site_url: https://hindi.news18.com/
          - key: abp-news
            site_url: https://abplive.com/
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      SITE_URL: ${{ matrix.site_url }}
      REPORT_KEY: ${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate automatic settings
        run: |
          set -euxo pipefail
          python -m compileall -q scripts backend/app
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          p = urlparse(os.environ['SITE_URL'])
          if p.scheme != 'https' or not p.netloc:
              raise SystemExit('Publisher URL must be HTTPS')
          assert int(os.environ['MAX_PAGES']) == 5
          assert int(os.environ['MAX_DEPTH']) == 5
          assert int(os.environ['MAX_DISCOVERED_URLS']) == 1000
          assert os.environ['BOTH_DEVICES'].lower() == 'true'
          assert os.environ['AD_SCRAPER_RETAIN_SCREENSHOTS'].lower() == 'false'
          PY
      - name: Run bounded site-wide crawl with retries and watchdog
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "${REPORT_KEY}: scrape attempt $attempt/3"
            rm -rf ci-output data/runs
            if timeout --signal=TERM --kill-after=30s "${MAX_RUNTIME_MINUTES}m" python scripts/ci_site_scrape.py; then
              echo "${REPORT_KEY}: scrape attempt $attempt completed"
              break
            else
              rc=$?
              echo "${REPORT_KEY}: scrape attempt $attempt stopped with exit code $rc"
            fi
            if [ "$attempt" = 3 ]; then
              echo "${REPORT_KEY}: all 3 bounded attempts failed"
              exit 1
            fi
            sleep 10
          done
      - name: Remove temporary screenshot evidence
        if: always()
        run: |
          set -euo pipefail
          if [ -d data/runs ]; then
            find data/runs -name screenshot.png -type f -delete
            find data/runs -name trace.zip -type f -delete
            find data/runs -type d -name ad_candidates -prune -exec rm -rf {} +
          fi
      - name: Verify report outputs
        shell: bash
        run: |
          set -euxo pipefail
          test -s ci-output/report/site-report.html
          test -s ci-output/report/site-report.pdf
          test -s ci-output/report/site_summary.json
          test -s ci-output/report/crawl_manifest.json
          test -s ci-output/run_metadata.json
          test -s ci-output/crawl_results.json
          test "$(find data/runs -name result.json -type f | wc -l)" -gt 0
          test "$(find data/runs -name screenshot.png -type f | wc -l)" -eq 0
          test "$(find data/runs -path '*/ad_candidates/*.png' -o -path '*/ad_candidates/*.jpg' -o -path '*/ad_candidates/*.jpeg' -o -path '*/ad_candidates/*.webp' | wc -l)" -eq 0
      - name: Upload standalone latest HTML report
        uses: actions/upload-artifact@v4
        with:
          name: latest-html-report-${{ matrix.key }}
          path: ci-output/report/site-report.html
          if-no-files-found: error
          retention-days: 30
      - name: Upload site report package
        uses: actions/upload-artifact@v4
        with:
          name: site-report-${{ matrix.key }}
          path: |
            ci-output/report/site-report.html
            ci-output/report/site-report.pdf
            ci-output/report/site_summary.json
            ci-output/report/crawl_manifest.json
            ci-output/run_metadata.json
            ci-output/crawl_results.json
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        if: always()
        run: |
          echo "## ${REPORT_KEY}" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Maximum same-site pages per device: $MAX_PAGES" >> "$GITHUB_STEP_SUMMARY"
          echo "Maximum crawl depth: $MAX_DEPTH" >> "$GITHUB_STEP_SUMMARY"
          echo "Maximum discovered URLs: $MAX_DISCOVERED_URLS" >> "$GITHUB_STEP_SUMMARY"
          echo "Desktop + mobile: $BOTH_DEVICES" >> "$GITHUB_STEP_SUMMARY"
          echo "Site watchdog: ${MAX_RUNTIME_MINUTES} minutes per attempt" >> "$GITHUB_STEP_SUMMARY"
          echo 'Screenshots/candidate screenshot files are not retained in the automatic report artifact.' >> "$GITHUB_STEP_SUMMARY"

  comparison:
    name: 13-Site comparison table
    needs: site-reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Download all site report packages
        uses: actions/download-artifact@v4
        with:
          pattern: site-report-*
          path: site-results
          merge-multiple: false
      - name: Validate all 13 reports
        run: |
          set -euxo pipefail
          count=$(find site-results -name site_summary.json -type f | wc -l)
          test "$count" -eq 13
      - name: Build comparison HTML and PDF
        run: |
          python scripts/build_multi_site_report.py --input site-results --output comparison
          test -s comparison/comparison.html
          test -s comparison/comparison.pdf
          grep -q '13-Site Ad Intelligence Comparison' comparison/comparison.html
          grep -q 'Maximum pages per device = 5' comparison/comparison.html
          grep -q 'Maximum crawl depth = 5' comparison/comparison.html
      - name: Upload comparison HTML
        uses: actions/upload-artifact@v4
        with:
          name: 13-site-comparison-html
          path: comparison/comparison.html
          if-no-files-found: error
          retention-days: 30
      - name: Upload comparison PDF
        uses: actions/upload-artifact@v4
        with:
          name: 13-site-comparison-pdf
          path: comparison/comparison.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        run: |
          echo '## 13-Site Comparison' >> "$GITHUB_STEP_SUMMARY"
          echo 'All 13 configured publishers are compared using the same bounded crawl controls.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Comparison table available as HTML and PDF.' >> "$GITHUB_STEP_SUMMARY"
