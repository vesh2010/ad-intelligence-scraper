name: windows-desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r desktop_requirements.txt

      - name: Install Chromium into bundle staging directory
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$pwd\packaging\browsers"
          python -m playwright install chromium

      - name: Install OCR and media tools
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          choco install ffmpeg -y --no-progress
          New-Item -ItemType Directory -Force packaging\tools | Out-Null
          Copy-Item "C:\Program Files\Tesseract-OCR\tesseract.exe" packaging\tools\ -Force
          Get-ChildItem "C:\Program Files\Tesseract-OCR\*.dll" | Copy-Item -Destination packaging\tools -Force
          New-Item -ItemType Directory -Force packaging\tools\tessdata | Out-Null
          Copy-Item "C:\Program Files\Tesseract-OCR\tessdata\eng.traineddata" packaging\tools\tessdata\ -Force
          $ffmpeg = Get-ChildItem "C:\ProgramData\chocolatey\bin\ffmpeg.exe" -ErrorAction SilentlyContinue
          $ffprobe = Get-ChildItem "C:\ProgramData\chocolatey\bin\ffprobe.exe" -ErrorAction SilentlyContinue
          if ($ffmpeg) { Copy-Item $ffmpeg.FullName packaging\tools\ffmpeg.exe -Force }
          if ($ffprobe) { Copy-Item $ffprobe.FullName packaging\tools\ffprobe.exe -Force }

      - name: Install UPX compressor
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          if (-not (Get-Command upx -ErrorAction SilentlyContinue)) { throw 'UPX was not installed' }
          upx --version

      - name: Build single-file executable
        shell: pwsh
        run: |
          $upx = Split-Path (Get-Command upx).Source -Parent
          python -m PyInstaller --clean --noconfirm --upx-dir "$upx" packaging\AdIntelligenceScraper.spec
          if (-not (Test-Path dist\AdIntelligenceScraper.exe)) { throw 'EXE was not produced' }
          $exe = Get-Item dist\AdIntelligenceScraper.exe
          Write-Host "EXE size: $([math]::Round($exe.Length / 1MB, 1)) MB"
          if ($exe.Length -gt 450MB) { throw 'EXE is larger than the 450 MB packaging budget' }

      - name: Portable executable smoke test
        shell: pwsh
        run: |
          $env:AD_SCRAPER_DISABLE_BROWSER = '1'
          $proc = Start-Process -FilePath "$pwd\dist\AdIntelligenceScraper.exe" -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 180; $i++) {
              if ($proc.HasExited) {
                $log = Join-Path $pwd 'startup.log'
                if (Test-Path $log) { Get-Content $log }
                throw "Portable executable exited before becoming healthy (exit code $($proc.ExitCode))"
              }
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/api/health' -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) {
              $log = Join-Path $pwd 'startup.log'
              if (Test-Path $log) { Get-Content $log }
              throw 'Portable executable did not expose /api/health within 180 seconds'
            }
            $docs = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/docs' -UseBasicParsing -TimeoutSec 5
            if ($docs.StatusCode -ne 200) { throw 'Portable executable /docs check failed' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Prepare release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\AdIntelligenceScraper.exe release\AdIntelligenceScraper.exe
          @'
          Ad Intelligence Scraper - Windows Portable

          Double-click AdIntelligenceScraper.exe.
          The application starts its local backend and opens the dashboard in your browser.
          No Docker, Python, Node.js, Playwright, Chromium or other runtime installation is required.

          The application runs locally in the background while you use the browser dashboard.
          Its data is stored in a data folder next to the executable.
          To stop it, end AdIntelligenceScraper.exe from Windows Task Manager.
          '@ | Set-Content release\README.txt

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdIntelligenceScraper-Windows-Portable
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release asset for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/AdIntelligenceScraper.exe
          generate_release_notes: true
