name: Windows local NCR monitor tests

on:
  pull_request:
    paths:
      - "scripts/run_hindustan_times_local.py"
      - "scripts/windows/**"
      - "scripts/capture_hindustan_times.py"
      - "scripts/validate_hindustan_times_batch.py"
      - "backend/tests/test_hindustan_times_local.py"
      - ".github/workflows/ht-local-monitor-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-proxy:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r scripts/windows/requirements-ht-monitor.txt pytest
      - name: Test local proxy and runner
        env:
          PYTHONPATH: .
        run: python -m pytest -q backend/tests/test_hindustan_times_local.py
      - name: Parse Windows installer and launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Write-Error
              exit 1
            }
          }
