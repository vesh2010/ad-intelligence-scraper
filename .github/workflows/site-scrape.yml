name: Site Scrape (manual)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Website URL to crawl'
        required: true
        type: string
      max_pages:
        description: 'Maximum same-site pages to crawl'
        required: false
        default: '1'
        type: string
      max_depth:
        description: 'Maximum crawl depth'
        required: false
        default: '0'
        type: string
      both_devices:
        description: 'Run desktop + mobile comparison'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYTHONPATH: backend
  SITE_URL: ${{ inputs.site_url }}
  MAX_PAGES: ${{ inputs.max_pages }}
  MAX_DEPTH: ${{ inputs.max_depth }}
  BOTH_DEVICES: ${{ inputs.both_devices }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate and compile
        run: |
          python -m compileall -q scripts backend/app
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          p = urlparse(os.environ['SITE_URL'])
          if p.scheme not in {'http', 'https'} or not p.netloc:
              raise SystemExit('Invalid site_url')
          if not 1 <= int(os.environ['MAX_PAGES']) <= 25:
              raise SystemExit('max_pages must be 1..25')
          if not 0 <= int(os.environ['MAX_DEPTH']) <= 5:
              raise SystemExit('max_depth must be 0..5')
          PY
      - name: Run scraper and render reports
        run: python scripts/ci_site_scrape.py
      - name: Verify complete report
        run: |
          test -s ci-output/scrape_result.json
          test -s ci-output/run_metadata.json
          test -s ci-output/report/index.html
          test -n "$(find data/runs -name result.json -type f -print -quit)"
          test -n "$(find data/runs -name report.html -type f -print -quit)"
          test -n "$(find data/runs -name report.pdf -type f -print -quit)"
          test -n "$(find data/runs -name intelligence.json -type f -print -quit)"
      - name: Upload complete scrape artifact
        uses: actions/upload-artifact@v4
        with:
          name: ad-intelligence-scrape-${{ github.run_id }}
          path: ci-output/
          if-no-files-found: error
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ci-output/report
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Job summary
        run: |
          echo '## Ad Intelligence Scrape' >> "$GITHUB_STEP_SUMMARY"
          echo "Site: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages: $MAX_PAGES | Depth: $MAX_DEPTH | Desktop + mobile: $BOTH_DEVICES" >> "$GITHUB_STEP_SUMMARY"
          echo "Report: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
