name: Site Scrape (manual)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Website URL to crawl'
        required: true
        type: string
      max_pages:
        description: 'Maximum same-site pages to crawl'
        required: false
        default: '1'
        type: string
      max_depth:
        description: 'Maximum crawl depth'
        required: false
        default: '0'
        type: string
      both_devices:
        description: 'Run desktop + mobile comparison'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  PYTHONPATH: backend
  SITE_URL: ${{ inputs.site_url }}
  MAX_PAGES: ${{ inputs.max_pages }}
  MAX_DEPTH: ${{ inputs.max_depth }}
  BOTH_DEVICES: ${{ inputs.both_devices }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate and compile
        run: |
          set -euxo pipefail
          python -m compileall -q scripts backend/app
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          p = urlparse(os.environ['SITE_URL'])
          if p.scheme not in {'http', 'https'} or not p.netloc:
              raise SystemExit('Invalid site_url')
          if not 1 <= int(os.environ['MAX_PAGES']) <= 25:
              raise SystemExit('max_pages must be 1..25')
          if not 0 <= int(os.environ['MAX_DEPTH']) <= 10:
              raise SystemExit('max_depth must be 0..10')
          PY
      - name: Run scraper and render reports
        run: |
          set -euxo pipefail
          rm -rf ci-output data/runs
          python scripts/ci_site_scrape.py
      - name: Upload debug output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug-${{ github.run_id }}
          path: |
            data/
            ci-output/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify complete report
        run: |
          set -euxo pipefail
          test -s ci-output/scrape_result.json
          test -s ci-output/run_metadata.json
          test -s ci-output/report/index.html
          result_count=$(find data/runs -name result.json -type f | wc -l)
          html_count=$(find data/runs -name report.html -type f | wc -l)
          pdf_count=$(find data/runs -name report.pdf -type f | wc -l)
          intelligence_count=$(find data/runs -name intelligence.json -type f | wc -l)
          page_count=$(find data/runs -name page.html -type f | wc -l)
          screenshot_count=$(find data/runs -name screenshot.png -type f | wc -l)
          test "$result_count" -gt 0
          test "$html_count" -gt 0
          test "$pdf_count" -gt 0
          test "$intelligence_count" -gt 0
          test "$page_count" -gt 0
          test "$screenshot_count" -gt 0
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('ci-output/run_metadata.json').read_text(encoding='utf-8'))
          if not metadata.get('run_ids'):
              raise SystemExit('run_metadata.json has no run_ids')
          print('Verified report runs:', ', '.join(metadata['run_ids']))
          PY
      - name: Upload complete scrape artifact
        uses: actions/upload-artifact@v4
        with:
          name: ad-intelligence-scrape-${{ github.run_id }}
          path: ci-output/
          if-no-files-found: error
          retention-days: 14
      - name: Job summary
        if: always()
        run: |
          echo '## Ad Intelligence Scrape' >> "$GITHUB_STEP_SUMMARY"
          echo "Site: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages: $MAX_PAGES | Depth: $MAX_DEPTH | Desktop + mobile: $BOTH_DEVICES" >> "$GITHUB_STEP_SUMMARY"
          echo 'Complete scrape report is available in the workflow artifact.' >> "$GITHUB_STEP_SUMMARY"