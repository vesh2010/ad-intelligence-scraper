name: Latest Ad Intelligence Reports

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  MAX_PAGES: '1'
  MAX_DEPTH: '0'
  BOTH_DEVICES: 'true'
  PYTHONPATH: backend

jobs:
  report:
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: ndtv
            site_url: https://ndtv.com/
          - key: news18
            site_url: https://news18.com/
          - key: indian-express
            site_url: https://indianexpress.com/
          - key: times-of-india
            site_url: https://timesofindia.indiatimes.com/
          - key: zee-news
            site_url: https://zeenews.india.com/
          - key: economic-times
            site_url: https://economictimes.indiatimes.com/
          - key: moneycontrol
            site_url: https://moneycontrol.com/
          - key: business-standard
            site_url: https://business-standard.com/
          - key: navbharat-times
            site_url: https://navbharattimes.indiatimes.com/
          - key: dainik-jagran
            site_url: https://jagran.com/
          - key: aaj-tak
            site_url: https://aajtak.in/
          - key: news18-hindi
            site_url: https://hindi.news18.com/
          - key: abp-news
            site_url: https://abplive.com/
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ matrix.site_url }}
      REPORT_KEY: ${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate and compile
        run: |
          set -euxo pipefail
          python -m compileall -q scripts backend/app
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          p = urlparse(os.environ['SITE_URL'])
          if p.scheme != 'https' or not p.netloc:
              raise SystemExit('Publisher URLs must be valid HTTPS URLs')
          PY
      - name: Run complete report scrape with retries
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "${REPORT_KEY}: scrape attempt $attempt/3"
            rm -rf ci-output data/runs
            if python scripts/ci_site_scrape.py; then
              echo 'Scrape completed successfully'
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo 'All scrape attempts failed'
              exit 1
            fi
            sleep 10
          done
      - name: Verify complete report and publish standalone HTML
        run: |
          set -euxo pipefail
          test -s ci-output/scrape_result.json
          test -s ci-output/run_metadata.json
          test -s ci-output/report/index.html
          html=$(find data/runs -name report.html -type f -print -quit)
          pdf=$(find data/runs -name report.pdf -type f -print -quit)
          test -n "$html"
          test -n "$pdf"
          test -s "$html"
          test -s "$pdf"
          cp "$html" "ci-output/latest-report.html"
          cp "$pdf" "ci-output/latest-report.pdf"
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('ci-output/run_metadata.json').read_text())
          if not metadata.get('run_ids'):
              raise SystemExit('run_metadata.json has no run_ids')
          print('Verified', metadata['site_url'], metadata['run_ids'])
          PY
      - name: Upload standalone latest HTML report
        uses: actions/upload-artifact@v4
        with:
          name: latest-html-report-${{ matrix.key }}
          path: ci-output/latest-report.html
          if-no-files-found: error
          retention-days: 30
      - name: Upload complete report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ad-intelligence-${{ matrix.key }}
          path: |
            ci-output/
            data/runs/
          if-no-files-found: error
          retention-days: 30
      - name: Job summary
        if: always()
        run: |
          echo "## ${REPORT_KEY} Ad Intelligence Report" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Standalone HTML artifact: latest-html-report-${{ matrix.key }}' >> "$GITHUB_STEP_SUMMARY"
