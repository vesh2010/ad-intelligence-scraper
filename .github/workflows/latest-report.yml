name: Latest Ad Intelligence Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://economictimes.indiatimes.com/
      MAX_PAGES: '1'
      MAX_DEPTH: '0'
      BOTH_DEVICES: 'true'
      PYTHONPATH: .:backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run complete report scrape with retries
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Scrape attempt $attempt/3"
            rm -rf ci-output data/runs
            if python scripts/ci_site_scrape.py; then
              echo 'Scrape completed successfully'
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo 'All scrape attempts failed'
              exit 1
            fi
            sleep 10
          done
      - name: Build UI-compatible report bundle
        run: |
          mkdir -p ci-output/latest-report
          cp -a data/runs/. ci-output/latest-report/
          python - <<'PY'
          import json
          from pathlib import Path
          runs = sorted(Path('data/runs').glob('*/result.json'))
          if not runs:
              raise SystemExit('No crawl result was generated')
          latest = runs[-1].parent.name
          payload = json.loads(runs[-1].read_text())
          (Path('ci-output/latest-report') / 'latest_run.json').write_text(
              json.dumps({'run_id': latest, 'result': payload}, indent=2), encoding='utf-8'
          )
          (Path('ci-output/latest-report') / 'UI_REPORT_URL.txt').write_text(
              f'/api/runs/{latest}/report.html\n/api/runs/{latest}/report.pdf\n/api/runs/{latest}/intelligence\n', encoding='utf-8'
          )
          PY
      - name: Verify report completeness
        run: |
          test -s ci-output/scrape_result.json
          test -s ci-output/run_metadata.json
          test -n "$(find ci-output/latest-report -name result.json -type f -print -quit)"
          test -n "$(find ci-output/latest-report -name page.html -type f -print -quit)"
          test -n "$(find ci-output/latest-report -name screenshot.png -type f -print -quit)"
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(next(Path('ci-output/latest-report').glob('latest_run.json')).read_text())
          result = latest['result']
          assert result.get('url'), 'Missing crawl URL'
          assert 'ad_records' in result, 'Missing normalized ad records'
          print('Verified UI-compatible latest run:', latest['run_id'])
          PY
      - name: Upload complete report
        uses: actions/upload-artifact@v4
        with:
          name: latest-ad-intelligence-report
          path: ci-output/
          if-no-files-found: error
          retention-days: 14
      - name: Job summary
        run: |
          echo '## Latest Ad Intelligence Report' >> "$GITHUB_STEP_SUMMARY"
          echo "Site: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Desktop + mobile: true' >> "$GITHUB_STEP_SUMMARY"
          echo 'Complete raw crawl + UI-compatible report artifacts uploaded.' >> "$GITHUB_STEP_SUMMARY"
