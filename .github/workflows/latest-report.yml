name: Latest Ad Intelligence Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_URL: https://economictimes.indiatimes.com/
  MAX_PAGES: '1'
  MAX_DEPTH: '0'
  BOTH_DEVICES: 'true'
  PYTHONPATH: backend

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate and compile
        run: |
          python -m compileall -q scripts backend/app
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          p = urlparse(os.environ['SITE_URL'])
          if p.scheme not in {'http', 'https'} or not p.netloc:
              raise SystemExit('Invalid site_url')
          PY
      - name: Run complete report scrape with retries
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Scrape attempt $attempt/3"
            rm -rf ci-output data/runs
            if python scripts/ci_site_scrape.py; then
              echo 'Scrape completed successfully'
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo 'All scrape attempts failed'
              exit 1
            fi
            sleep 10
          done
      - name: Verify complete report
        run: |
          test -s ci-output/scrape_result.json
          test -s ci-output/run_metadata.json
          test -s ci-output/report/index.html
          test -n "$(find data/runs -name result.json -type f -print -quit)"
          test -n "$(find data/runs -name page.html -type f -print -quit)"
          test -n "$(find data/runs -name screenshot.png -type f -print -quit)"
          test -n "$(find data/runs -name report.html -type f -print -quit)"
          test -n "$(find data/runs -name report.pdf -type f -print -quit)"
          test -n "$(find data/runs -name intelligence.json -type f -print -quit)"
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('ci-output/run_metadata.json').read_text())
          if not metadata.get('run_ids'):
              raise SystemExit('run_metadata.json has no run_ids')
          print('Verified report runs:', ', '.join(metadata['run_ids']))
          PY
      - name: Publish dated reports into repository
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          TARGET="reports/$DATE"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -a ci-output/report/. "$TARGET/"
          find data/runs -name report.pdf -type f -exec cp {} "$TARGET/site-report.pdf" \; -quit
          find data/runs -name report.html -type f -exec cp {} "$TARGET/site-report.html" \; -quit
          printf '%s\n' "# Ad Intelligence Report — $DATE" "" "Generated from the latest automated scrape of $SITE_URL." "" "- [HTML report](./index.html)" "- [Site HTML report](./site-report.html)" "- [Site PDF report](./site-report.pdf)" > "$TARGET/README.md"
          printf '%s\n' "$DATE" > reports/LATEST
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          if git diff --cached --quiet; then
            echo 'No report changes to publish'
          else
            git commit -m "Publish ad intelligence report $DATE [skip ci]"
            git push
          fi
      - name: Upload complete report artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-ad-intelligence-report
          path: ci-output/
          if-no-files-found: error
          retention-days: 14
      - name: Job summary
        run: |
          echo '## Latest Ad Intelligence Report' >> "$GITHUB_STEP_SUMMARY"
          echo "Site: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Desktop + mobile: true' >> "$GITHUB_STEP_SUMMARY"
          echo 'A permanent dated copy has been published under reports/YYYY-MM-DD/.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The complete scrape report is also available in the workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
